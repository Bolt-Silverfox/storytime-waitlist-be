# Test and build gate for pull requests into `main`.
#
# This file used to also deploy production: it rsynced the working tree over
# SSH to `secrets.SERVER_HOST` and ran `scripts/deploy.sh` there via
# appleboy/ssh-action. That host no longer serves production — the waitlist API
# now runs as a container on the shared EC2 box, whose containers are
# reconciled by `redeploy.sh` (invocable over SSM). The deploy job has been
# removed, along with the `rsync --delete` that would mirror the repo tree over
# a live deployment path if `SERVER_HOST` were ever repointed at the current
# box.
#
# Production deploys are to be made by `deploy-production.yml`, a manual
# (`workflow_dispatch`) caller of the shared storytime-devops pipeline. That
# file is not merged yet — it is open as PR #104 — and it also needs a
# Dockerfile on `main` and the deploy roles applied before it can run. So there
# is no automated production deploy path in the interim; the running container
# is unaffected.
#
# `pnpm run build` ran only inside the deleted deploy job (post-merge and on
# dispatch). It is now a step in the test job instead, so the build is checked
# before merge rather than after.
name: Production Backend CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Allow manual trigger

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Install runs with --ignore-scripts, so @prisma/client's postinstall
      # (generate) is skipped. PrismaService extends PrismaClient, so tests can't
      # import it until the client is generated.
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          # generate does not connect; prisma.config.ts only requires the var to exist.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public

      - name: Run tests (if any)
        run: pnpm test || echo "⚠ No tests found"

      - name: Build
        run: pnpm run build
